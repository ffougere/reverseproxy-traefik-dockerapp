http:
  routers:
    blue:
      entryPoints:
        - web
      rule: PathPrefix(`/blue`)
      middlewares:
        - blue-strip
      service: blue

    green:
      entryPoints:
        - web
      rule: PathPrefix(`/green`)
      middlewares:
        - green-strip
      service: green

  middlewares:
    blue-strip:
      stripPrefix:
        prefixes:
          - /blue
    green-strip:
      stripPrefix:
        prefixes:
          - /green

  services:
    blue:
      loadBalancer:
        servers:
          - url: http://blue:8080
    green:
      loadBalancer:
        servers:
          - url: http://green:8081
