services:

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    ports:
      - "9443:9443"   # HTTP traffic
      - "9095:8080"   # Traefik dashboard
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - proxy

  # ── Application Blue ───────────────────────────────────────────────────────
  blue:
    build: ./blue
    container_name: blue
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-appdb}
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blue.entrypoints=web"
      - "traefik.http.routers.blue.rule=PathPrefix(`/blue`)"
      - "traefik.http.middlewares.blue-strip.stripprefix.prefixes=/blue"
      - "traefik.http.routers.blue.middlewares=blue-strip"
      - "traefik.http.services.blue.loadbalancer.server.port=8080"
    networks:
      - proxy
      - backend

  # ── Application Green ──────────────────────────────────────────────────────
  green:
    build: ./green
    container_name: green
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-appdb}
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.green.entrypoints=web"
      - "traefik.http.routers.green.rule=PathPrefix(`/green`)"
      - "traefik.http.middlewares.green-strip.stripprefix.prefixes=/green"
      - "traefik.http.routers.green.middlewares=green-strip"
      - "traefik.http.services.green.loadbalancer.server.port=8081"
    networks:
      - proxy
      - backend

  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

networks:
  proxy:
    name: proxy
  backend:
    name: backend

volumes:
  db_data:
