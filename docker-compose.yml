services:

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    ports:
      - "9443:9443"   # HTTP traffic
      - "9095:8080"   # Traefik dashboard
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - proxy

  # ── Application 1 ──────────────────────────────────────────────────────────
  hello1:
    build: ./hello1
    container_name: hello1
    restart: unless-stopped
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hello1.entrypoints=web"
      - "traefik.http.routers.hello1.rule=PathPrefix(`/hello1`)"
      - "traefik.http.middlewares.hello1-strip.stripprefix.prefixes=/hello1"
      - "traefik.http.routers.hello1.middlewares=hello1-strip"
      - "traefik.http.services.hello1.loadbalancer.server.port=8080"
    networks:
      - proxy
      - backend

  # ── Application 2 ──────────────────────────────────────────────────────────
  hello2:
    build: ./hello2
    container_name: hello2
    restart: unless-stopped
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hello2.entrypoints=web"
      - "traefik.http.routers.hello2.rule=PathPrefix(`/hello2`)"
      - "traefik.http.middlewares.hello2-strip.stripprefix.prefixes=/hello2"
      - "traefik.http.routers.hello2.middlewares=hello2-strip"
      - "traefik.http.services.hello2.loadbalancer.server.port=8081"
    networks:
      - proxy
      - backend

  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

networks:
  proxy:
    name: proxy
  backend:
    name: backend

volumes:
  db_data:
